<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground:#F4F6F7; --surface:#FFFFFF; --surface-2:#E9EEF1;
    --ink:#101C24; --ink-2:#3C4F5E; --muted:#6A7E8D;
    --rule:#D6DFE4; --rule-strong:#B9C7D0;
    --accent:#0B6E77;
    --s1:#008B9E; --s2:#B25E00; --s3:#6E4B9E;
    --ok:#1F7A4D; --warn:#93590A; --crit:#A32B36;
    --grid:#E4EAEE;
    --f-display:"IBM Plex Sans Condensed","Helvetica Neue",Arial,sans-serif;
    --f-body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#0B1218; --surface:#131E26; --surface-2:#1A2932;
      --ink:#DEE8EE; --ink-2:#A7BAC7; --muted:#78909F;
      --rule:#21313C; --rule-strong:#2F434F;
      --accent:#45CBD4;
      --s1:#16A2B4; --s2:#C97520; --s3:#8E6FD0;
      --ok:#46C07E; --warn:#DFA33C; --crit:#EF7078;
      --grid:#1E2C36;
    }
  }
  :root[data-theme="dark"] {
    --ground:#0B1218; --surface:#131E26; --surface-2:#1A2932;
    --ink:#DEE8EE; --ink-2:#A7BAC7; --muted:#78909F;
    --rule:#21313C; --rule-strong:#2F434F;
    --accent:#45CBD4;
    --s1:#16A2B4; --s2:#C97520; --s3:#8E6FD0;
    --ok:#46C07E; --warn:#DFA33C; --crit:#EF7078;
    --grid:#1E2C36;
  }

  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--f-body); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1240px; margin:0 auto; padding-inline:20px; padding-block:28px 72px; }

  /* ---- engine strip, on every page ---- */

  /* ---- course home ---- */
  .hero {
    background:var(--surface); border:1px solid var(--rule); border-radius:4px;
    padding:26px 28px; margin-bottom:22px;
  }
  .hero h2 { font-size:1.45rem; margin-bottom:10px; }
  .hero p { color:var(--ink-2); max-width:64ch; margin:0 0 16px; }
  .progress { display:flex; gap:5px; margin:18px 0 8px; }
  .progress i {
    flex:1; height:5px; border-radius:3px; background:var(--surface-2);
  }
  .progress i.on { background:var(--accent); }
  .prog-label { font-family:var(--f-mono); font-size:.72rem; color:var(--muted); }

  .steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; }
  .step {
    background:var(--surface); border:1px solid var(--rule);
    border-radius:4px; padding:15px 16px;
  }
  .step .num {
    font-family:var(--f-mono); font-size:.7rem; color:var(--accent);
    letter-spacing:.1em; display:block; margin-bottom:6px;
  }
  .step h3 { font-size:.95rem; margin:0 0 6px; }
  .step p { font-size:.85rem; color:var(--ink-2); margin:0; }
  .step code {
    display:block; font-family:var(--f-mono); font-size:.78rem; margin-top:9px;
    background:var(--surface-2); padding:6px 8px; border-radius:3px; color:var(--ink);
    overflow-x:auto;
  }

  /* ---- shell ---- */
  .shell { display:grid; grid-template-columns:232px 1fr; gap:32px; align-items:start; }
  @media (max-width:900px) { .shell { grid-template-columns:1fr; gap:20px; } }

  nav { position:sticky; top:20px; display:flex; flex-direction:column; gap:2px; }
  @media (max-width:900px) { nav { position:static; } }
  nav .navhead {
    font-family:var(--f-mono); font-size:.64rem; letter-spacing:.11em;
    text-transform:uppercase; color:var(--muted); padding:0 10px 8px;
  }
  nav a {
    display:flex; align-items:baseline; gap:9px; padding:7px 10px;
    border-radius:3px; text-decoration:none; color:var(--ink-2);
    font-size:.87rem; border-left:2px solid transparent;
  }
  nav a:hover { background:var(--surface-2); }
  nav a.on { background:var(--surface-2); color:var(--ink); border-left-color:var(--accent); font-weight:500; }
  nav a .wk {
    font-family:var(--f-mono); font-size:.72rem; color:var(--muted); flex:none; min-width:16px;
  }
  nav a.on .wk { color:var(--accent); }
  nav a.soon { color:var(--muted); }
  nav a .tick { margin-left:auto; color:var(--ok); font-size:.8rem; }
  nav .sep { height:1px; background:var(--rule); margin:10px 0; }

  /* ---- rendered lab markdown ---- */
  .md { font-size:.94rem; color:var(--ink-2); }
  .md h1 { font-family:var(--f-display); font-size:1.5rem; color:var(--ink); margin:0 0 14px; }
  .md h2 {
    font-family:var(--f-display); font-size:1.15rem; color:var(--ink);
    margin:30px 0 10px; padding-bottom:7px; border-bottom:1px solid var(--rule);
  }
  .md h3 { font-family:var(--f-display); font-size:1rem; color:var(--ink); margin:22px 0 7px; }
  .md p { margin:0 0 12px; max-width:72ch; }
  .md ul, .md ol { margin:0 0 12px; padding-left:20px; max-width:72ch; }
  .md li { margin-bottom:5px; }
  .md strong { color:var(--ink); font-weight:600; }
  .md code {
    font-family:var(--f-mono); font-size:.86em; background:var(--surface-2);
    padding:1px 5px; border-radius:3px; color:var(--ink);
  }
  .md pre {
    background:var(--surface-2); border:1px solid var(--rule); border-radius:4px;
    padding:13px 15px; overflow-x:auto; margin:0 0 14px;
  }
  .md pre code { background:none; padding:0; font-size:.82rem; line-height:1.5; }
  .md blockquote {
    margin:0 0 14px; padding:10px 15px; border-left:3px solid var(--accent);
    background:color-mix(in srgb, var(--accent) 7%, transparent); border-radius:0 3px 3px 0;
  }
  .md blockquote p:last-child { margin:0; }
  .md table { min-width:0; margin-bottom:14px; }
  .md th { text-align:left; padding:0 14px 8px 0; }
  .md td { text-align:left; padding:8px 14px 8px 0; color:var(--ink-2); font-family:inherit; }
  .md td:first-child { color:var(--ink-2); }
  .md p.refs {
    font-size:.85rem; color:var(--muted); max-width:78ch;
    background:var(--surface); border:1px solid var(--rule);
    border-left:2px solid var(--accent);
    border-radius:0 3px 3px 0; padding:10px 14px; margin:0 0 14px;
  }
  .md p.refs strong { color:var(--ink-2); font-weight:600; }
  .md p.refs a { color:var(--accent); text-decoration:none; border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent); }
  .md p.refs a:hover { border-bottom-color:var(--accent); }

  .md hr { border:none; border-top:1px solid var(--rule); margin:26px 0; }
  .md a { color:var(--accent); }

  .tabs {
    display:flex; gap:4px; margin-bottom:20px;
    border-bottom:1px solid var(--rule);
  }
  .tab {
    background:none; border:none; border-bottom:2px solid transparent;
    color:var(--muted); font-family:var(--f-body); font-size:.88rem; font-weight:500;
    padding:8px 14px; cursor:pointer; border-radius:0;
  }
  .tab:hover { color:var(--ink-2); }
  .tab.on { color:var(--ink); border-bottom-color:var(--accent); }

  /* ---- prediction ritual ---- */
  .predict {
    background:var(--surface); border:1px solid var(--rule);
    border-left:3px solid var(--s2); border-radius:4px; padding:16px 18px; margin-bottom:22px;
  }
  .predict p.q { font-size:.95rem; color:var(--ink); margin:6px 0 12px; max-width:66ch; }
  .predict .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .predict input { min-width:220px; flex:1; }
  .predict .locked {
    font-family:var(--f-mono); font-size:.9rem; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--rule); border-radius:3px; padding:7px 10px;
  }
  .predict .hint { font-size:.82rem; color:var(--muted); margin-top:9px; }

  .needs {
    display:inline-block; font-family:var(--f-mono); font-size:.66rem;
    letter-spacing:.08em; text-transform:uppercase; color:var(--warn);
    border:1px solid var(--warn); border-radius:3px; padding:3px 7px; margin-left:8px;
  }

  h1,h2 { font-family:var(--f-display); font-weight:700; margin:0; line-height:1.15; letter-spacing:-.01em; }
  h1 { font-size:1.6rem; }
  h2 { font-size:1.1rem; }
  .eyebrow {
    font-family:var(--f-mono); font-size:.68rem; letter-spacing:.13em;
    text-transform:uppercase; color:var(--muted); margin:0;
  }

  header.top {
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:16px; flex-wrap:wrap; padding-bottom:16px; margin-bottom:24px;
    border-bottom:1px solid var(--rule);
  }

  /* ---- stat tiles: the five numbers that matter ---- */

  /* ---- panels ---- */
  .panel {
    background:var(--surface); border:1px solid var(--rule);
    border-radius:4px; overflow:hidden; margin-bottom:22px;
  }
  .panel-head {
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    flex-wrap:wrap; padding:11px 16px; background:var(--surface-2);
    border-bottom:1px solid var(--rule);
  }
  .panel-body { padding:16px; }
  figure { margin:0; }

  /* ---- readout tiles (used by the lab runners) ---- */
  .readout {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:1px; background:var(--rule); border:1px solid var(--rule);
    border-radius:3px; overflow:hidden;
  }
  .readout > div { background:var(--surface); padding:13px 15px; }
  .r-k {
    display:block; font-family:var(--f-mono); font-size:.64rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted); margin-bottom:4px;
  }
  .r-v {
    display:block; font-family:var(--f-mono); font-size:1.4rem; font-weight:600;
    line-height:1.1; font-variant-numeric:tabular-nums; color:var(--ink);
  }
  .r-v.hot { color:var(--warn); }
  .r-v.bad { color:var(--crit); }
  .r-sub {
    display:block; font-family:var(--f-mono); font-size:.66rem;
    color:var(--muted); margin-top:3px;
  }

  /* ---- Week 0 widgets ---- */
  .w {
    background:var(--surface); border:1px solid var(--rule); border-radius:4px;
    overflow:hidden; margin:0 0 20px;
  }
  .w-head {
    display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:10px 15px; background:var(--surface-2); border-bottom:1px solid var(--rule);
  }
  .w-title { font-family:var(--f-display); font-weight:700; font-size:.98rem; color:var(--ink); }
  .w-note { font-family:var(--f-mono); font-size:.68rem; color:var(--muted); }
  .w-body { padding:15px; }
  .w-sub {
    font-family:var(--f-mono); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); margin:0 0 8px;
  }
  .w-foot { font-size:.83rem; color:var(--muted); margin:13px 0 0; max-width:72ch; }
  .w-foot code { font-family:var(--f-mono); font-size:.9em; }

  .w textarea {
    width:100%; font-family:var(--f-mono); font-size:.85rem; line-height:1.5;
    color:var(--ink); background:var(--surface); border:1px solid var(--rule-strong);
    border-radius:3px; padding:9px 11px; resize:vertical;
  }
  .w textarea:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }

  .chips { display:flex; flex-wrap:wrap; gap:3px; margin-top:12px; }
  .chip {
    font-family:var(--f-mono); font-size:.8rem; padding:3px 6px; border-radius:3px;
    white-space:pre; border:1px solid transparent;
  }
  .chip.c0 { background:color-mix(in srgb,var(--s1) 16%,transparent); }
  .chip.c1 { background:color-mix(in srgb,var(--s2) 16%,transparent); }
  .chip.c2 { background:color-mix(in srgb,var(--accent) 14%,transparent); }
  .chip.c3 { background:color-mix(in srgb,var(--s1) 26%,transparent); }
  .chip.c4 { background:color-mix(in srgb,var(--s2) 26%,transparent); }
  .chip.c5 { background:color-mix(in srgb,var(--accent) 24%,transparent); }
  .chip.prompt { background:var(--surface-2); color:var(--ink-2); }
  .chip.gen { background:color-mix(in srgb,var(--s1) 20%,transparent); color:var(--ink); }
  .chip.gen.new { border-color:var(--s1); }

  .ctx { display:flex; flex-wrap:wrap; gap:3px; align-items:center; min-height:56px; }
  .caret {
    display:inline-block; width:2px; height:15px; background:var(--accent);
    animation:blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .caret { animation:none; } }

  .w-stats {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(115px,1fr)); gap:1px;
    margin-top:14px; background:var(--rule); border:1px solid var(--rule);
    border-radius:3px; overflow:hidden;
  }
  .w-stats > div { background:var(--surface); padding:10px 12px; }
  .w-stats b {
    display:block; font-family:var(--f-mono); font-size:1.15rem; font-weight:600;
    color:var(--ink); font-variant-numeric:tabular-nums; line-height:1.2;
  }
  .w-stats span {
    display:block; font-family:var(--f-mono); font-size:.63rem; letter-spacing:.06em;
    color:var(--muted); margin-top:2px;
  }

  .lanes { display:flex; flex-direction:column; gap:3px; }
  .lane { display:flex; align-items:center; gap:9px; }
  .lane-id, .lane-n {
    font-family:var(--f-mono); font-size:.72rem; color:var(--muted);
    flex:none; width:16px; text-align:center;
  }
  .lane-n { color:var(--ink-2); text-align:right; }
  .track { display:flex; gap:2px; flex:1; }
  .track i {
    flex:1; height:15px; border-radius:2px; background:var(--surface-2);
  }
  .track i.wait { background:color-mix(in srgb,var(--muted) 22%,transparent); }
  .track i.busy.s1 { background:var(--s2); }
  .track i.busy.s2 { background:var(--s1); }

  .w-explain { font-size:.88rem; color:var(--ink-2); margin:0 0 12px; max-width:72ch; }
  .w-explain b { color:var(--ink); }
  .w-cap { font-size:.82rem; color:var(--muted); margin:7px 0 0; }
  .w-cap b { color:var(--ink); font-family:var(--f-mono); }
  .kv-legend { display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:12px; }
  .kv-legend span {
    display:inline-flex; align-items:center; gap:7px;
    font-family:var(--f-mono); font-size:.7rem; color:var(--ink-2);
  }
  .kv-legend .sw {
    width:13px; height:13px; border-radius:2px; flex:none; background:var(--surface-2);
  }
  .kv-legend .sw.busy.s1 { background:var(--s2); }
  .kv-legend .sw.wait { background:color-mix(in srgb,var(--muted) 22%,transparent); }

  .kvgrid { display:flex; flex-direction:column; gap:1px; }
  .kvrow { display:flex; gap:1px; }
  .kvrow i {
    flex:1; height:3px; border-radius:1px; background:var(--surface-2);
    transition:background .15s ease, opacity .12s ease;
  }
  .kvrow i.kvp { background:color-mix(in srgb,var(--muted) 45%,transparent); }
  .kvrow i.kvg { background:var(--s1); }
  .kvrow i.fresh { background:var(--accent); }
  .kv-legend .sw.kvp { background:color-mix(in srgb,var(--muted) 45%,transparent); }
  .kv-legend .sw.kvg { background:var(--s1); }

  /* Hovering the grid spotlights one token's column and names the block the
     pointer is over. Works in every state — idle, generating, paused, done. */
  .kvwrap { position:relative; }
  .kvgrid.dim .kvrow i { opacity:.26; }
  .kvgrid.dim .kvrow i.col { opacity:1; }
  .kvgrid.dim .kvrow i.cell {
    box-shadow:0 0 0 1.5px var(--accent); border-radius:1px; position:relative; z-index:1;
  }
  .kvtip {
    position:absolute; pointer-events:none; z-index:5; width:236px;
    padding:9px 11px; border-radius:5px; border:1px solid var(--rule);
    background:var(--surface); box-shadow:0 8px 24px rgba(0,0,0,.18);
    font-family:var(--f-mono); font-size:.7rem; line-height:1.55; color:var(--ink-2);
  }
  .kvtip-tok {
    font-size:.84rem; color:var(--ink); margin-bottom:6px;
    padding-bottom:6px; border-bottom:1px solid var(--rule); word-break:break-all;
  }
  .kvtip-tok.pending { color:var(--muted); }
  .kvtip-row b { color:var(--ink); font-weight:600; }
  .kvtip-row.on b { color:var(--accent); }
  .kvtip-row.off { color:var(--muted); }
  @media (hover:none) { .kvtip { display:none; } }

  .kv-cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; margin-top:16px; }
  .kv-bars { display:flex; flex-direction:column; gap:1px; }
  .kvb {
    height:4px; border-radius:2px; background:var(--surface-2);
    min-width:2px; transition:background .12s ease;
  }
  .kvb.no.on { background:var(--s2); }
  .kvb.yes.on { background:var(--s1); }
  .w-range {
    font-family:var(--f-mono); font-size:.9rem; color:var(--accent);
    font-variant-numeric:tabular-nums; padding:7px 0;
  }
  .w input[type="range"] { accent-color:var(--accent); padding:0; border:none; background:none; }

  /* ---- controls ---- */
  .ctl { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
  .field { display:flex; flex-direction:column; gap:5px; }
  .field label {
    font-family:var(--f-mono); font-size:.64rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted);
  }
  input, select {
    font-family:var(--f-mono); font-size:.84rem; color:var(--ink);
    background:var(--surface); border:1px solid var(--rule-strong);
    border-radius:3px; padding:7px 9px; min-width:110px;
  }
  button {
    font-family:var(--f-body); font-size:.86rem; font-weight:600;
    color:var(--surface); background:var(--accent);
    border:1px solid var(--accent); border-radius:3px;
    padding:8px 16px; cursor:pointer;
  }
  button.ghost { background:transparent; color:var(--ink-2); border-color:var(--rule-strong); }
  button[disabled] { opacity:.5; cursor:not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline:2px solid var(--accent); outline-offset:1px;
  }

  table { width:100%; border-collapse:collapse; font-size:.84rem; min-width:560px; }
  .tscroll { overflow-x:auto; }
  th {
    font-family:var(--f-mono); font-size:.64rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); text-align:right; font-weight:500;
    padding:0 0 8px 14px; border-bottom:1px solid var(--rule-strong);
  }
  th:first-child, td:first-child { text-align:left; padding-left:0; }
  td {
    font-family:var(--f-mono); font-variant-numeric:tabular-nums; color:var(--ink-2);
    text-align:right; padding:8px 0 8px 14px; border-bottom:1px solid var(--rule);
  }
  td:first-child { color:var(--s1); font-weight:500; }

  .verdict {
    margin-top:16px; padding:12px 15px; border-radius:3px; font-size:.9rem;
    border-left:3px solid var(--s1); background:color-mix(in srgb, var(--s1) 9%, transparent);
  }
  .verdict b { color:var(--ink); }
  .note { font-size:.84rem; color:var(--muted); margin-top:10px; }
  .note code { font-family:var(--f-mono); font-size:.9em; }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  @media (max-width:560px) { .wrap { padding-block:20px 48px; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <p class="eyebrow">AI infrastructure for SREs</p>
      <h1 id="pagetitle">Operating LLM Inference</h1>
    </div>
    <div class="sub" id="reposub"></div>
  </header>

  <div class="shell">
    <nav id="nav"></nav>
    <main>
      <div class="predict" id="predict" hidden>
        <p class="eyebrow">Predict first</p>
        <p class="q" id="predict-q"></p>
        <div class="row" id="predict-row"></div>
        <p class="hint">Writing it down before you measure is the point. You cannot
          un-see the answer, and a prediction you never committed to is one you will
          always claim you had.</p>
      </div>
      <div id="tool"></div>
      <div class="md" id="body"></div>
    </main>
  </div>
</div>
<script src="/widgets.js"></script>
<script src="/app.js"></script>
</body>
</html>
